# ── autosage – nginx dev config (HTTP-only on localhost) ─────────────────────
#
# Purpose
# ───────
# Faithful dev mirror of nginx/autosage.conf (the prod TLS terminator), minus
# TLS. Lets local docker compose exercise the same ingress shape that prod
# uses: nginx is the only host-exposed service, all proxy / header / SSE
# buffering settings match prod, services are reached by docker DNS names.
#
# Why no TLS in dev
# ─────────────────
# • Clerk dev keys (pk_test_*) accept http://localhost as a valid origin.
# • mkcert + self-signed certs add friction without catching real bugs that
#   wouldn't already surface in CI / staging against the real prod config.
#
# Streaming notes (same as prod — see nginx/autosage.conf for the why)
# ────────────────────────────────────────────────────────────────────
# • proxy_buffering off       → chunks flush as they arrive, not at EOF
# • proxy_read_timeout 3600s  → outlasts the 1800s SSE subscription window
# • resolver 127.0.0.11       → Docker's embedded DNS, lazy upstream lookup
#                               so nginx survives transient container churn

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name localhost;

    # Scripts live in GCS, not posted through here; 10 MB is plenty.
    client_max_body_size 10m;

    # ── Deferred DNS resolution for upstreams ────────────────────────────
    # Using Docker's embedded resolver with a variable in proxy_pass means
    # nginx resolves the upstream lazily at request time. Lets nginx start
    # and reload even when a backend container is briefly absent — it just
    # returns 502 until it's back.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── SSE / log-streaming settings (apply to all proxied locations) ────
    proxy_buffering       off;
    proxy_cache           off;
    proxy_http_version    1.1;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;

    # ── / → Django (server:8000) ─────────────────────────────────────────
    location / {
        # Variable forces resolution at request time, not config-load time.
        set $django_upstream http://server:8000;
        proxy_pass $django_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Empty Connection enables keep-alive between nginx and upstream,
        # required so SSE chunks aren't terminated mid-stream.
        proxy_set_header Connection        "";
        # Django already sets this on streaming responses; pass it through.
        proxy_set_header X-Accel-Buffering no;
    }

    # ── /ai/ → Autobot (autobot:8030) — added in T03 ─────────────────────
    # location /ai/ {
    #     set $autobot_upstream http://autobot:8030;
    #     proxy_pass $autobot_upstream;
    #
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection        "";
    #     proxy_set_header X-Accel-Buffering no;
    # }
}
