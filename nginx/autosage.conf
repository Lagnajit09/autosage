# ── autosage – nginx production TLS config ───────────────────────────────────
#
# IMPORTANT: every occurrence of __DUCKDNS_DOMAIN__ below is substituted by the
# GitHub Actions deploy workflow before this file is scp'd to the host. If you
# need to run nginx with this config manually, replace it with your real
# DuckDNS hostname (e.g. autosage-api.duckdns.org).
#
# Streaming notes
# ───────────────
# The Django SSE views (`stream_workflow_run`, `execute_script`) emit
# text/event-stream responses. nginx MUST flush each chunk immediately or
# the frontend will see all logs arrive in one dump at the end. The
# `proxy_buffering off;` directive plus a long `proxy_read_timeout` and
# honoring the `X-Accel-Buffering: no` response header are what make
# real-time log streaming work through this reverse proxy.

# HTTP → HTTPS redirect, plus ACME http-01 challenge passthrough.
server {
    listen      80;
    listen      [::]:80;
    server_name __DUCKDNS_DOMAIN__;

    # Let's Encrypt http-01 challenges must remain plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: permanent redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy → Django (Uvicorn on the internal docker network).
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name __DUCKDNS_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DUCKDNS_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DUCKDNS_DOMAIN__/privkey.pem;

    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # Scripts live in GCS, not posted through here; 10 MB is plenty.
    client_max_body_size 10m;

    # ── Deferred DNS resolution for the django upstream ──────────────────
    # Use Docker's embedded resolver (127.0.0.11) and a variable in
    # proxy_pass so nginx resolves `django` lazily at request time. This
    # lets nginx start (and `nginx -s reload` succeed) even when the django
    # container is briefly absent — it just returns 502 until it's back.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── SSE / log-streaming settings (apply to all proxied locations) ────
    proxy_buffering       off;
    proxy_cache           off;
    proxy_http_version    1.1;
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;

    # ── /api/ai/ → Autobot (autobot:8030) ────────────────────────────────
    # Routes /api/ai/... traffic to the Autobot FastAPI service. The prefix
    # is stripped before forwarding, so Autobot's internal routes can be
    # bare paths (e.g. /health/, /threads/) without baking the external
    # URL prefix into application code. X-Forwarded-Prefix tells Autobot
    # what prefix it's mounted under so it can build correct self-URLs.
    #
    # Must be declared BEFORE `location /` so nginx's longest-prefix match
    # picks it up for /api/ai/* paths. Server-level proxy_buffering off +
    # proxy_read_timeout 3600s apply, so SSE chat streams flush in real time.
    #
    # NOTE (T01-T02): the autobot service is profile-gated in
    # docker-compose.oci.yml until T23 ships the GHCR image. Until then,
    # /api/ai/* returns 502 because the upstream isn't running — that's
    # expected. To bring it up: `docker compose --profile autobot up -d`.
    location /api/ai/ {
        rewrite ^/api/ai/(.*)$ /$1 break;

        set $autobot_upstream http://autobot:8030;
        proxy_pass $autobot_upstream;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Prefix /api/ai;
        proxy_set_header Connection         "";
        proxy_set_header X-Accel-Buffering  no;
    }

    location / {
        # Variable forces resolution at request time, not config-load time.
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Empty Connection enables keep-alive between nginx and upstream,
        # required so SSE chunks aren't terminated mid-stream.
        proxy_set_header Connection        "";
        # Django already sets this on streaming responses; pass it through.
        proxy_set_header X-Accel-Buffering no;
    }
}
