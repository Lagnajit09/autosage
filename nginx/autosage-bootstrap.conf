# ── autosage – nginx bootstrap config (HTTP-only, used once) ─────────────────
#
# Purpose:
#   On a brand-new host the Let's Encrypt cert files don't exist yet, so the
#   real autosage.conf (which references them) cannot start nginx. This
#   bootstrap config listens on :80 only, serves /.well-known/acme-challenge/
#   from the certbot webroot volume, and returns 503 for everything else.
#
# Use during initial bootstrap:
#   cp nginx/autosage-bootstrap.conf nginx/active.conf
#   docker compose -f docker-compose.oci.yml up -d nginx
#   docker compose -f docker-compose.oci.yml run --rm certbot \
#       certonly --webroot -w /var/www/certbot \
#       -d <chosen>.duckdns.org --email you@example.com \
#       --agree-tos --no-eff-email
#
# After the cert is issued, swap to the real config:
#   cp nginx/autosage.conf nginx/active.conf
#   docker compose -f docker-compose.oci.yml exec nginx nginx -s reload

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        add_header Content-Type text/plain always;
        return 503 "TLS not yet provisioned. Run certbot, then swap nginx/active.conf.\n";
    }
}
