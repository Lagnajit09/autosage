name: Build and Deploy Server

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "docker-compose.oci.yml"
      - "nginx/**"
      - ".github/workflows/deploy-server.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lagnajit09/autosage/autosage-server
  CONTAINER_NAME: autosage-server
  COMPOSE_FILE: docker-compose.oci.yml
  HOST_DIR: /home/ubuntu/autosage-server

jobs:
  build-and-push:
    name: Build & Push Docker Image (linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      # OCI Ampere A1 is aarch64; the host runner is amd64.
      # QEMU lets buildx emulate arm64 during the build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OCI Ampere A1
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Substitute the DuckDNS hostname into the nginx config before scp'ing it.
      # The placeholder __DUCKDNS_DOMAIN__ appears in nginx/autosage.conf for
      # server_name and ssl_certificate paths.
      - name: Substitute DuckDNS domain into nginx config
        run: |
          set -e
          if [ -z "${{ secrets.DUCKDNS_DOMAIN }}" ]; then
            echo "DUCKDNS_DOMAIN secret is not set."
            exit 1
          fi
          sed -i "s/__DUCKDNS_DOMAIN__/${{ secrets.DUCKDNS_DOMAIN }}/g" nginx/autosage.conf
          echo ">>> Resulting server_name lines:"
          grep -n 'server_name' nginx/autosage.conf || true

      - name: Copy compose + nginx configs to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: "docker-compose.oci.yml,nginx/autosage.conf,nginx/autosage-bootstrap.conf"
          target: ${{ env.HOST_DIR }}/
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ env.HOST_DIR }}

            echo ">>> Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo ">>> Ensuring nginx/active.conf exists (first-run safety net)..."
            if [ ! -f nginx/active.conf ]; then
              echo "    active.conf missing — seeding with bootstrap config so nginx can start."
              cp nginx/autosage-bootstrap.conf nginx/active.conf
            fi

            echo ">>> Pulling latest image (linux/arm64)..."
            docker compose -f ${{ env.COMPOSE_FILE }} pull

            echo ">>> Bringing the stack up..."
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

            echo ">>> Checking whether Let's Encrypt cert is already provisioned..."
            if docker compose -f ${{ env.COMPOSE_FILE }} run --rm \
                 --entrypoint sh certbot \
                 -c "test -f /etc/letsencrypt/live/${{ secrets.DUCKDNS_DOMAIN }}/fullchain.pem" 2>/dev/null; then
              echo ">>> Cert present — syncing nginx/active.conf to autosage.conf and reloading..."
              cp nginx/autosage.conf nginx/active.conf
              docker compose -f ${{ env.COMPOSE_FILE }} exec -T nginx nginx -t
              docker compose -f ${{ env.COMPOSE_FILE }} exec -T nginx nginx -s reload
            else
              echo ">>> No cert yet — leaving nginx/active.conf untouched (bootstrap phase)."
              echo ">>> Run the manual bootstrap once to obtain the cert; future deploys will switch to autosage.conf automatically."
            fi

            echo ">>> Pruning dangling images..."
            docker image prune -f

            echo ">>> Deploy finished."

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: External health check over HTTPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            set -e
            cd ${{ env.HOST_DIR }}

            echo ">>> Waiting 30s for the new containers to warm up..."
            sleep 30

            echo ">>> Internal Django healthcheck (via docker exec, bypasses nginx)..."
            docker compose -f ${{ env.COMPOSE_FILE }} exec -T django \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/').read()" \
              || { echo "Internal Django health check FAILED"; exit 1; }
            echo "Internal Django health check PASSED."

            echo ">>> Public HTTPS health check via https://${{ secrets.DUCKDNS_DOMAIN }}/api/health/ ..."
            RESPONSE=$(curl --silent --max-time 15 --write-out "\n%{http_code}" "https://${{ secrets.DUCKDNS_DOMAIN }}/api/health/")
            HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

            echo "Response body : $HTTP_BODY"
            echo "HTTP status   : $HTTP_CODE"

            if [ "$HTTP_CODE" -eq 503 ]; then
              echo "Got 503 — nginx is in bootstrap mode (no Let's Encrypt cert yet)."
              echo "This is expected before the manual bootstrap is run. Failing softly."
              exit 0
            fi

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "Public health check FAILED — expected 200, got $HTTP_CODE"
              exit 1
            fi

            echo "Public HTTPS health check PASSED."
