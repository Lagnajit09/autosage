<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'JetBrains Mono', ui-monospace, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="AutoSage — workflow automation for servers. Autobot handles it end to end: writes, runs, and fixes.">

  <defs>
