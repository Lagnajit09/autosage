<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Subtle grid lines -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#000000" stroke-width="0.35" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top border bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#000000"/>

  <!-- Bottom border bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#000000"/>

  <!-- Logo icon (the actual AutoSage icon.png) -->
  <image
    href="/icon.png"
    x="100"
    y="195"
    width="240"
    height="240"
    preserveAspectRatio="xMidYMid meet"
  />

  <!-- Thin vertical divider -->
  <rect x="388" y="180" width="1.5" height="270" fill="#000000" opacity="0.15"/>

  <!-- "AutoSage" wordmark -->
  <text
    x="424"
    y="298"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="800"
    letter-spacing="-3"
    fill="#000000"
  >AutoSage</text>

  <!-- Tagline -->
  <text
    x="426"
    y="358"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="0.3"
    fill="#000000"
    opacity="0.55"
  >Seamless automation, smarter execution.</text>

  <!-- Domain -->
  <text
    x="600"
    y="560"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="3"
    fill="#000000"
    opacity="0.3"
    text-anchor="middle"
  >AUTOSAGEX.WEB.APP</text>

</svg>
