<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>AutoSage – AI-Powered Workflow Automation</title>
    <meta name="description" content="AutoSage: seamless automation, smarter execution. Build AI-powered workflows, run scripts on your own servers, and chat with Autobot — your intelligent automation assistant." />
    <meta name="keywords" content="workflow automation, AI automation, autobot, script runner, AI workflows, devops automation, AutoSage" />
    <meta name="author" content="AutoSage" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f0f0f" />

    <!-- Canonical -->
    <link rel="canonical" href="https://autosagex.web.app/" />

    <!-- Favicon / Icons -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://autosagex.web.app/" />
    <meta property="og:site_name" content="AutoSage" />
    <meta property="og:title" content="AutoSage – AI-Powered Workflow Automation" />
    <meta property="og:description" content="Build AI-powered workflows, run scripts on your own servers, and chat with Autobot — your intelligent automation assistant. Seamless automation, smarter execution." />
    <meta property="og:image" content="https://autosagex.web.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AutoSage – AI-Powered Workflow Automation" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@autosageapp" />
    <meta name="twitter:creator" content="@autosageapp" />
    <meta name="twitter:title" content="AutoSage – AI-Powered Workflow Automation" />
    <meta name="twitter:description" content="Build AI-powered workflows, run scripts on your own servers, and chat with Autobot — your intelligent automation assistant." />
    <meta name="twitter:image" content="https://autosagex.web.app/og-cover.png" />
    <meta name="twitter:image:alt" content="AutoSage – AI-Powered Workflow Automation" />

    <!-- Structured Data: WebSite + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://autosagex.web.app/#website",
          "url": "https://autosagex.web.app/",
          "name": "AutoSage",
          "description": "AI-powered workflow automation platform",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://autosagex.web.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://autosagex.web.app/#app",
          "name": "AutoSage",
          "url": "https://autosagex.web.app/",
          "description": "Build AI-powered workflows, run scripts on your servers, and leverage Autobot — your intelligent automation assistant.",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
