# ── autosage – OCI Ampere A1 (Ubuntu 22.04 aarch64) production stack ─────────
#
# Services
# ────────
#   nginx              TLS terminator + reverse proxy   → host :80, :443
#   django             Uvicorn ASGI (Django + SSE)       → internal :8000
#   redis              self-hosted broker + Pub/Sub      → internal :6379
#                      (replaces Upstash on production — see CELERY_BROKER_URL)
#   celery             execute_workflow worker (queue: celery)
#   beat               Celery Beat (DatabaseScheduler, single instance)
#   scheduler-worker   fire_scheduled_workflow worker (queue: scheduler)
#   certbot            one-shot, profile `tools` — invoked manually for cert
#                      issue/renew. Not started by `up -d`.
#
# Host directory layout expected (paths are bind-mounted):
#   /home/ubuntu/autosage-server/
#       server.env               → Django/Celery env (see .env.server example)
#       gcs_key.json             → GCS service-account key
#       docker-compose.oci.yml   ← this file (scp'd by deploy workflow)
#       nginx/
#           autosage.conf           ← production TLS config (scp'd)
#           autosage-bootstrap.conf ← HTTP-only config (scp'd)
#           active.conf             ← the currently-mounted config
#                                     (the deploy workflow copies
#                                     autosage.conf → active.conf each run)
#
# Streaming notes
# ───────────────
# • Django ASGI is reached only via nginx; host port 8000 is NOT published.
# • nginx config disables proxy_buffering so SSE log streams flush in real time.
# • Django sets X-Accel-Buffering: no on streaming responses; nginx honours it.
#
# First-time bootstrap (manual, ~once):
#   1. cp nginx/autosage-bootstrap.conf nginx/active.conf
#   2. docker compose -f docker-compose.oci.yml up -d nginx
#   3. docker compose -f docker-compose.oci.yml run --rm certbot \
#          certonly --webroot -w /var/www/certbot \
#          -d <chosen>.duckdns.org --email you@example.com \
#          --agree-tos --no-eff-email
#   4. cp nginx/autosage.conf nginx/active.conf
#   5. docker compose -f docker-compose.oci.yml exec nginx nginx -s reload
#
# Renewal (cron, recommended 1×/day):
#   docker compose -f docker-compose.oci.yml run --rm certbot renew --quiet \
#     && docker compose -f docker-compose.oci.yml exec nginx nginx -s reload

networks:
  autosage-net:
    driver: bridge

volumes:
  letsencrypt:      # /etc/letsencrypt — certs + account, shared nginx ↔ certbot
  certbot-webroot:  # /var/www/certbot — ACME http-01 challenge files
  redis-data:       # /data — Redis RDB snapshots for warm restarts

services:
  # ── Redis (Celery broker + result backend + SSE Pub/Sub) ─────────────────
  # Replaces Upstash in production. Local docker-bridge connection → ~0.1 ms
  # latency and no per-command billing. Capped at 256 MB with LRU eviction
  # for belt-and-braces against any unexpected growth (Celery normally keeps
  # itself well under that — broker items pop on consumption, result keys
  # TTL via CELERY_RESULT_EXPIRES, Pub/Sub is ephemeral).
  redis:
    image: redis:7-alpine
    container_name: autosage-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly no
      --loglevel warning
    expose:
      - "6379"
    networks:
      - autosage-net
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Django ASGI (Uvicorn) ────────────────────────────────────────────────
  django:
    image: ghcr.io/lagnajit09/autosage/autosage-server:latest
    container_name: autosage-server
    env_file:
      - /home/ubuntu/autosage-server/server.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /home/ubuntu/autosage-server/gcs_key.json:/app/creds/service-account.json:ro
    expose:
      - "8000"
    networks:
      - autosage-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Celery worker (execute_workflow, default `celery` queue) ─────────────
  celery:
    image: ghcr.io/lagnajit09/autosage/autosage-server:latest
    container_name: autosage-celery
    command: celery -A server worker --loglevel=info --queues=celery --concurrency=4
    env_file:
      - /home/ubuntu/autosage-server/server.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /home/ubuntu/autosage-server/gcs_key.json:/app/creds/service-account.json:ro
    networks:
      - autosage-net
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat (cron dispatcher, DatabaseScheduler) ─────────────────────
  beat:
    image: ghcr.io/lagnajit09/autosage/autosage-server:latest
    container_name: autosage-beat
    command: >
      celery -A server beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    env_file:
      - /home/ubuntu/autosage-server/server.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /home/ubuntu/autosage-server/gcs_key.json:/app/creds/service-account.json:ro
    networks:
      - autosage-net
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Scheduler worker (fire_scheduled_workflow, `scheduler` queue) ────────
  # Dedicated so cron-fired dispatch is never blocked behind long-running
  # execute_workflow tasks in the default queue.
  scheduler-worker:
    image: ghcr.io/lagnajit09/autosage/autosage-server:latest
    container_name: autosage-scheduler-worker
    command: celery -A server worker --loglevel=info --queues=scheduler --concurrency=2
    env_file:
      - /home/ubuntu/autosage-server/server.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - /home/ubuntu/autosage-server/gcs_key.json:/app/creds/service-account.json:ro
    networks:
      - autosage-net
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── nginx (TLS terminator, public entrypoint) ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: autosage-nginx
    volumes:
      - /home/ubuntu/autosage-server/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - autosage-net
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s

  # ── certbot (one-shot, profile `tools`) ──────────────────────────────────
  # Not started by `docker compose up -d`. Invoke explicitly:
  #   docker compose -f docker-compose.oci.yml run --rm certbot \
  #       certonly --webroot -w /var/www/certbot \
  #       -d <chosen>.duckdns.org --email you@example.com \
  #       --agree-tos --no-eff-email
  certbot:
    image: certbot/certbot:latest
    container_name: autosage-certbot
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: ["certbot"]
