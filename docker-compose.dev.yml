# ── autosage – Docker Compose (DEV — faithful prod replica) ────────────────────
#
# This file mirrors docker-compose.oci.yml (production on OCI Ampere A1) as
# closely as is sensible for local development. The headline differences:
#   • nginx runs HTTP-only on localhost:8080 (prod terminates real Let's
#     Encrypt TLS on a DuckDNS hostname on :443). Host port 8080 (not 80)
#     because Windows boxes commonly have IIS / "World Wide Web Publishing
#     Service" / another local web server already bound to :80, which causes
#     `docker compose up` to die with "address already in use". If your :80
#     is free and you want true prod-shape, edit the nginx `ports:` block
#     below to `"80:80"` and update CORS + VITE_API_URL accordingly.
#   • exec-worker is included here (it's a Cloud Run service in prod, not part
#     of the OCI compose stack). Its host port is kept for direct debugging.
#   • Image build contexts are local (./server, ./exec-worker) instead of
#     pulling pre-built GHCR images.
# Everything else — service names, network shape, redis config, env-file
# pattern, healthchecks — matches prod so Redis / SSE / proxy bugs surface
# here first.
#
# Services
# ────────
#   redis            Broker + result backend + SSE Pub/Sub (matches prod OCI)
#   exec-worker      FastAPI NDJSON streaming microservice  → localhost:8020
#   server           Django ASGI / SSE streaming server     (internal :8000)
#   worker           Celery worker — `celery` queue (execute_workflow)
#   beat             Celery Beat dispatcher (DatabaseScheduler)
#   scheduler-worker Celery worker — `scheduler` queue (fire_scheduled_workflow)
#   nginx            HTTP-only ingress, proxies / to server  → localhost:8080
#
# Usage
# ─────
#   1. Copy docker-compose.env.example → .env.server  and fill in real values.
#   2. Copy docker-compose.env.example → .env.worker  and fill in real values.
#      (CELERY_BROKER_URL / CELERY_RESULT_BACKEND are overridden in this file
#       to point at the local redis service — Upstash is NOT required for dev.)
#   3. Place your GCS service-account JSON at:  ./gcs-key.json
#      (it is bind-mounted read-only into both containers — never baked in)
#   4. docker compose up --build
#   5. Hit the app at  http://localhost:8080/  (nginx → server).
#      Run the Vite client with  VITE_API_URL=http://localhost:8080  for parity.
#
# Streaming notes
# ───────────────
# • Both services run Uvicorn with --http h11 to lock HTTP/1.1 for SSE/NDJSON.
# • exec-worker uses --timeout-graceful-shutdown 30; compose stop_grace_period
#   is set to 35 s to give in-flight streams time to finish.
# • PYTHONUNBUFFERED=1 is set in both Dockerfiles; it is re-stated here as a
#   belt-and-braces guard against any override.
# • X-Accel-Buffering: no is set at the application layer (views.py / main.py).
# • nginx mirrors the prod SSE-safe settings: proxy_buffering off, long
#   proxy_read_timeout, deferred DNS resolution. See nginx/autosage-dev.conf.

networks:
  # Dedicated bridge so the services can reach each other by service name
  # (e.g., http://exec-worker:8020, http://redis:6379) without exposing
  # internal traffic to the host network.
  autosage-net:
    driver: bridge

volumes:
  # Redis RDB snapshots survive container restarts. Matches the prod volume
  # of the same name in docker-compose.oci.yml.
  redis-data:

services:
  # ── Redis (Celery broker + result backend + SSE Pub/Sub) ─────────────────
  # Mirrors the production OCI Redis service config exactly: same image, same
  # memory cap (1 GB), same eviction policy (volatile-lru — only TTL-bearing
  # keys are evictable, so Celery queue items can never be lost). The full
  # rationale lives in docker-compose.oci.yml under the redis service.
  redis:
    image: redis:7-alpine
    container_name: autosage-redis
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy volatile-lru
      --save 60 1
      --appendonly no
      --loglevel warning
    expose:
      - "6379"
    networks:
      - autosage-net
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s


  # ── exec-worker ─────────────────────────────────────────────────────────────
  exec-worker:
    build:
      context: ./exec-worker
      dockerfile: Dockerfile
    image: autosage-exec-worker:latest
    container_name: autosage-exec-worker

    # Load worker secrets from a local env file (never committed to git)
    env_file:
      - .env.worker

    # Belt-and-braces: ensure Python never buffers stdout/stderr
    environment:
      PYTHONUNBUFFERED: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json

    # Bind-mount GCS service-account key read-only.
    # Inside the container the path is /run/secrets/gcs-key.json.
    # Point GOOGLE_APPLICATION_CREDENTIALS to this path in .env.worker.
    volumes:
      - ./gcs-key.json:/run/secrets/gcs-key.json:ro

    ports:
      - "8020:8020"

    networks:
      - autosage-net

    # Graceful shutdown: allow 35 s (> uvicorn --timeout-graceful-shutdown 30)
    # so that in-flight NDJSON streams can finish before the container is killed.
    stop_grace_period: 35s

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8020/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── server (Django / Uvicorn SSE) ───────────────────────────────────────────
  # Host port is intentionally NOT published — nginx is the only ingress, just
  # like in prod. For raw-API debugging, add a docker-compose.dev.override.yml
  # with `ports: ["8000:8000"]` or use `docker compose exec server …`.
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: autosage-server:latest
    container_name: autosage-server

    env_file:
      - .env.server

    environment:
      PYTHONUNBUFFERED: "1"
      # Override EXEC_WORKER_URL to use Docker-internal DNS instead of localhost.
      # The exec-worker service is reachable by its service name on autosage-net.
      EXEC_WORKER_URL: "http://exec-worker:8020/api/worker/execute"
      # Override Celery URLs to use the local redis container instead of
      # whatever Upstash URL is in .env.server. Mirrors prod's OCI Redis path.
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json

    volumes:
      - ./gcs-key.json:/run/secrets/gcs-key.json:ro

    expose:
      - "8000"

    networks:
      - autosage-net

    depends_on:
      exec-worker:
        condition: service_healthy
      redis:
        condition: service_healthy

    stop_grace_period: 35s

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Celery worker (workflow execution) ───────────────────────────────────────
  # Handles long-running execute_workflow tasks dispatched by enqueue_workflow_run.
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: autosage-server:latest
    container_name: autosage-worker
    command: >
      celery -A server worker
      --loglevel=info
      --queues=celery
      --concurrency=4
    env_file:
      - .env.server
    environment:
      PYTHONUNBUFFERED: "1"
      # Mirror server: use local redis container, not Upstash, in compose.
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json
    volumes:
      - ./gcs-key.json:/run/secrets/gcs-key.json:ro
    networks:
      - autosage-net
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat (schedule dispatcher) ────────────────────────────────────────
  # IMPORTANT: run exactly ONE beat instance in production.
  # Uses the DatabaseScheduler so PeriodicTask rows are the source of truth.
  beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: autosage-server:latest
    container_name: autosage-beat
    command: >
      celery -A server beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    env_file:
      - .env.server
    environment:
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json
    volumes:
      - ./gcs-key.json:/run/secrets/gcs-key.json:ro
    networks:
      - autosage-net
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Scheduler worker (lightweight dispatch) ───────────────────────────────────
  # Dedicated worker for the 'scheduler' queue so fire_scheduled_workflow tasks
  # are never queued behind long-running execute_workflow tasks.
  scheduler-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: autosage-server:latest
    container_name: autosage-scheduler-worker
    command: >
      celery -A server worker
      --loglevel=info
      --queues=scheduler
      --concurrency=2
    env_file:
      - .env.server
    environment:
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json
    volumes:
      - ./gcs-key.json:/run/secrets/gcs-key.json:ro
    networks:
      - autosage-net
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Autobot (FastAPI LLM assistant — hello-world scaffold for T02) ───────
  # Built locally from ./autobot (no GHCR pull). T09 will expand main.py +
  # requirements + Dockerfile; for now this just serves the hello-world
  # endpoint so the nginx /api/ai/ route (T03) has something to reach.
  #
  # depends_on covers what later tasks will need (redis for cache, server
  # for tool-call API). The hello-world doesn't strictly require either, but
  # codifying it here means T11+ won't need to revisit this block.
  autobot:
    build:
      context: ./autobot
      dockerfile: Dockerfile
    image: autosage-autobot:latest
    container_name: autosage-autobot
    env_file:
      - .env.autobot
    environment:
      PYTHONUNBUFFERED: "1"
    expose:
      - "8030"
    networks:
      - autosage-net
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8030/')",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── nginx (HTTP-only dev ingress, mirrors prod TLS terminator) ───────────
  # Faithful dev mirror of the prod nginx service in docker-compose.oci.yml,
  # minus TLS. Proxy headers, SSE buffering, and deferred-DNS upstream lookup
  # all match the prod config — so any SSE / streaming / proxy-pass quirk
  # surfaces here first. Clerk dev keys (pk_test_*) accept http://localhost:8080.
  #
  # Host port is 8080 (not 80) so the stack starts on Windows boxes where IIS
  # / WWW Publishing Service / another local web server already owns :80.
  # If :80 is free on your machine and you want exact prod-shape, change the
  # `ports:` block to "80:80" and update CORS_ALLOWED_ORIGINS + VITE_API_URL.
  #
  # The container still listens on :80 internally — nginx/autosage-dev.conf
  # has `listen 80;`. Only the host-side mapping changes.
  #
  # See nginx/autosage-dev.conf for the routes (the `location /ai/` block for
  # Autobot will land in T03).
  nginx:
    image: nginx:1.27-alpine
    container_name: autosage-nginx
    volumes:
      - ./nginx/autosage-dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - autosage-net
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
